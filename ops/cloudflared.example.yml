# Fill in the owned hostname and the credential file generated by cloudflared.
# Store the real configuration outside Git, under Library/Application Support.
tunnel: REPLACE_WITH_TUNNEL_UUID
credentials-file: /absolute/private/path/to/tunnel-credentials.json
protocol: http2
edge-ip-version: "4"
metrics: 127.0.0.1:45301
ingress:
  - hostname: music.example.com
    service: http://127.0.0.1:4173
  - service: http_status:404
