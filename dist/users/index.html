<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SANZO · 用户管理</title><script src="/workspace-theme.js"></script><link rel="stylesheet" href="/explore.css"><link rel="stylesheet" href="/site-shell.css"><link rel="stylesheet" href="/account.css"><link rel="stylesheet" href="/users.css"><script type="module" src="/site-shell.js"></script><script type="module" src="/users.js"></script></head>
<body class="app-shell" data-page="users">
<svg width="0" height="0" aria-hidden="true" style="position:absolute"><symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 13a9 9 0 0 1-10-10 9 9 0 1 0 10 10Z"/></symbol><symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/></symbol></svg>
<aside id="app-sidebar" class="app-sidebar" aria-label="应用导航"></aside><header class="explore-header"><div class="header-end"><button class="theme-toggle" type="button" id="theme-toggle" aria-label="切换颜色模式"><svg><use id="theme-icon" href="#i-sun"/></svg><span id="theme-label">浅色</span></button></div></header>
<main class="account-main people-main" id="main-content">
<a class="people-back" href="/account/">我的账号</a>
<div class="people-heading"><div><span class="eyebrow">SANZO / PEOPLE</span><h1>用户管理</h1><p>手动维护昵称、联系邮箱与备注。</p></div><button class="people-primary" id="add-user" type="button"><span aria-hidden="true">＋</span>新增用户</button></div>
<section class="people-summary" aria-label="用户统计"><div><strong id="people-total">—</strong><span>全部用户</span></div><div><strong id="people-active">—</strong><span>启用</span></div><div><strong id="people-inactive">—</strong><span>停用</span></div><p id="people-sync" role="status">正在加载用户资料…</p></section>
<section class="people-panel" aria-label="用户列表"><div class="people-toolbar"><label class="people-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="people-search" type="search" aria-label="搜索用户" placeholder="搜索昵称、邮箱或备注" autocomplete="off"></label><label class="people-filter">状态<select id="people-filter"><option value="all">全部状态</option><option value="active">启用</option><option value="inactive">停用</option></select></label></div>
<table class="people-table"><thead><tr><th scope="col">用户</th><th scope="col">联系邮箱</th><th scope="col">备注</th><th scope="col">状态</th><th scope="col">操作</th></tr></thead><tbody id="people-list"></tbody></table>
<div class="people-empty" id="people-empty" hidden><span class="people-empty-symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></span><h2 id="people-empty-title">还没有用户资料</h2><p id="people-empty-copy">添加第一位用户，记录昵称、联系方式和备注。</p><button type="button" class="people-secondary" id="empty-add">新增用户</button></div>
<div class="people-pagination"><span id="people-count">正在读取…</span><div><button type="button" id="people-prev" aria-label="上一页" disabled>上一页</button><span id="people-page">1 / 1</span><button type="button" id="people-next" aria-label="下一页" disabled>下一页</button></div></div></section>
<p class="people-note">当前为手动用户资料管理。启用与停用用于整理记录，登录认证后续接入。</p>
</main>
<dialog id="people-dialog" class="people-dialog" aria-labelledby="people-dialog-title"><form id="people-form"><div class="people-dialog-heading"><div><span class="eyebrow">USER PROFILE</span><h2 id="people-dialog-title">新增用户</h2></div><button type="button" id="people-close" class="people-icon-button" aria-label="关闭用户编辑">×</button></div><p class="people-record-id" id="people-record-id"></p><label for="person-name">昵称 <span>必填</span></label><input id="person-name" name="name" maxlength="60" required autocomplete="off" placeholder="输入用户昵称"><label for="person-email">联系邮箱 <span>选填</span></label><input id="person-email" name="email" type="email" maxlength="254" autocomplete="off" placeholder="name@example.com"><label for="person-notes">备注 <span>选填</span></label><textarea id="person-notes" name="notes" maxlength="500" rows="3" placeholder="例如：内测用户，偏好爵士与电子音乐"></textarea><label for="person-status">管理状态</label><select id="person-status" name="status"><option value="active">启用</option><option value="inactive">停用</option></select><p id="people-form-feedback" role="status"></p><div class="people-dialog-actions"><button type="button" id="people-cancel" class="people-secondary">取消</button><button id="people-save" class="people-primary">保存用户</button></div></form></dialog>
<div id="people-toast" class="people-toast" role="status" hidden></div>
</body></html>
