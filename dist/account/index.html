<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SANZO · 我的账号</title><script src="/workspace-theme.js"></script><link rel="stylesheet" href="/explore.css"><link rel="stylesheet" href="/site-shell.css"><link rel="stylesheet" href="/account.css"><script type="module" src="/site-shell.js"></script><script type="module" src="/account.js"></script></head>
<body class="app-shell" data-page="account"><svg width="0" height="0" aria-hidden="true" style="position:absolute"><symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 13a9 9 0 0 1-10-10 9 9 0 1 0 10 10Z"/></symbol><symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/></symbol></svg><aside id="app-sidebar" class="app-sidebar" aria-label="应用导航"></aside><header class="explore-header"><div class="header-end"><button class="theme-toggle" type="button" id="theme-toggle" aria-label="切换颜色模式"><svg><use id="theme-icon" href="#i-sun"/></svg><span id="theme-label">浅色</span></button></div></header>
<main class="account-main" id="main-content"><div class="account-heading"><span class="eyebrow">YOUR SPACE</span><h1>我的账号</h1><p>你的资料、作品与声音，都在这里。</p><a id="admin-entry" class="account-action" href="/admin/" hidden>账号管理</a></div>
<div class="account-grid"><section class="account-card"><h2>个人资料</h2><form id="profile-form"><label for="profile-name">昵称</label><input id="profile-name" maxlength="60" required autocomplete="nickname" disabled><label for="profile-email">登录邮箱</label><input id="profile-email" readonly autocomplete="email"><button id="save-profile" disabled>保存资料</button></form><p id="profile-feedback" class="account-feedback" role="status">正在加载账号…</p><div class="account-actions"><a class="account-action" href="/signout-with-chatgpt?return_to=%2F" target="_top">退出登录</a></div></section>
<section class="account-card"><h2>我的云端空间</h2><div class="account-stats"><div><strong id="stat-works">—</strong><span>作品</span></div><div><strong id="stat-albums">—</strong><span>专辑</span></div><div><strong id="stat-assets">—</strong><span>音频素材</span></div></div><p id="storage-label">正在读取存储用量…</p><div class="storage-meter" role="progressbar" aria-label="音频存储用量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="storage-fill"></span></div><p>作品、专辑和音频归属于当前登录账号，可在不同设备上继续使用。</p><button id="export-data" disabled>导出我的资料</button></section>
<section class="account-card account-import"><div><h2>带上之前的灵感</h2><p>将此浏览器里已有的原型草稿、专辑、收藏和音频导入当前账号。保留本地原件，已有云端作品不会被覆盖。</p><p id="import-summary">正在检查本地资料…</p><p id="import-feedback" class="account-feedback" role="status"></p></div><button id="import-local" disabled>导入本地原型资料</button></section></div>
<div id="account-note" class="account-info">作品与素材仅属于当前账号。回收站内的文件仍占空间，永久删除后释放额度。</div></main></body></html>
