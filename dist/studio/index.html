<section class="player glass listening-dock" aria-label="音乐播放器">
  <div class="dock-leading"><div class="dock-identity"><div class="player-track dock-track"><img id="player-cover" src="/assets/forest.jpg" alt="当前播放作品封面"><div><strong id="player-title">选择作品开始播放</strong><span id="player-artist">我的 Studio</span></div></div></div>

    </details></div>

  <div class="dock-trailing"><div class="player-timeline progress-row"><span id="current-time">0:00</span><input type="range" class="progress" id="seek" min="0" max="100" value="0" aria-label="播放进度"><span id="duration">3:24</span></div><div class="player-extra dock-tools"><button class="icon-button like-button" id="player-like" aria-label="收藏当前歌曲" aria-pressed="false"><svg><use href="#i-heart"/></svg></button><button class="icon-button" id="mute" aria-label="静音"><svg><use href="#i-volume"/></svg></button><input type="range" class="volume" id="volume" min="0" max="100" value="55" aria-label="音量"></div></div>
