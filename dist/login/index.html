<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>SANZO · 登录</title><link rel="stylesheet" href="/auth.css"><script src="/auth.js" type="module"></script></head>
<body><main class="auth-card"><a class="brand" href="/">SANZO<span>音乐与灵感</span></a><nav id="auth-tabs" class="auth-tabs" aria-label="账号入口"><button type="button" data-auth-mode="login" aria-pressed="true">登录</button><button type="button" data-auth-mode="register" aria-pressed="false" disabled>注册</button></nav><h1 id="heading">欢迎回来</h1><p id="description">登录后即可开始创作，浏览和聆听无需登录。</p><form id="auth-form"><label id="name-label" hidden>昵称（选填）<input id="name" type="text" autocomplete="nickname" maxlength="60"></label><label id="email-label">邮箱<input id="email" type="email" autocomplete="username" maxlength="254" required></label><label>密码<input id="password" type="password" autocomplete="current-password" maxlength="256" required><small id="password-hint" class="field-hint" hidden>至少 12 个字符</small></label><label id="confirm-label" hidden>确认密码<input id="confirm-password" type="password" autocomplete="new-password" maxlength="256"></label><button id="submit">登录</button><p id="feedback" role="status"></p></form><section id="registration-help" hidden><p id="registration-message">正在确认注册方式…</p><p>每个账号默认拥有 1GB 空间，用于保存作品和素材。</p><a href="/">先浏览首页</a></section><p class="note"><a href="/">返回首页</a> · <a href="/explore/">探索音乐</a><br>忘记密码时，请联系管理员获取新的设置链接。</p></main></body></html>
