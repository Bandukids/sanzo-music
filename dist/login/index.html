<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>SANZO · 登录</title><link rel="stylesheet" href="/auth.css"><script src="/auth.js" type="module"></script></head>
<body><main class="auth-card"><a class="brand" href="/">SANZO<span>音乐与灵感</span></a><h1 id="heading">欢迎回来</h1><p id="description">使用管理员邀请的账号登录。</p><form id="auth-form"><label id="email-label">邮箱<input id="email" type="email" autocomplete="username" maxlength="254" required></label><label>密码<input id="password" type="password" autocomplete="current-password" maxlength="256" required></label><button id="submit">登录</button><p id="feedback" role="status"></p></form><p class="note">账号由管理员邀请创建。忘记密码时，请联系管理员获取新的设置链接。</p></main></body></html>
